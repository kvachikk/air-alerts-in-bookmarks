name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: firefox
    attributes:
      label: Firefox version
      placeholder: '153.0 on Linux'
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: What the bookmarks show
      options:
        - A question mark (?) that never goes away
        - A status that never changes
        - The wrong status for my region
        - No bookmark appears at all
        - Something else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Background console output
      description: >
        about:debugging → This Firefox → Inspect on this extension → Console.
        Lines are prefixed with [air-alerts].
      render: text
    validations:
      required: false
